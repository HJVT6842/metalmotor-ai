<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>2 · Botón WhatsApp (ping)</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; min-height:100%; background:#0f172a; color:#fff;
               font-family:-apple-system, system-ui, sans-serif; }
  main { padding: 28px 20px; min-height: 180vh; }
  /* Réplica exacta del efecto animate-ping de Tailwind usado en WhatsAppFloat */
  @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
  .float { position: fixed; bottom: 20px; right: 20px; z-index: 50;
           display:inline-flex; align-items:center; gap:8px;
           padding:12px 16px; border-radius:9999px; background:#25D366; color:#fff;
           box-shadow: 0 10px 30px -6px rgba(37,211,102,.7); font-weight:700; }
  .ping-wrap { position: relative; width:32px; height:32px; display:inline-flex;
               align-items:center; justify-content:center; }
  .ping { position:absolute; inset:0; border-radius:9999px; background:rgba(255,255,255,.4);
          animation: ping 1s cubic-bezier(0,0,.2,1) infinite; }
  .dot { position:relative; width:20px; height:20px; border-radius:9999px; background:#fff; }
</style>
</head>
<body>
<main>
  <h1>Prueba 2 — Botón WhatsApp (ping)</h1>
  <p style="color:#cbd5e1">Fondo + botón fijo con animación “ping” infinita y sombra grande (idéntico al del sitio).</p>
  <p style="color:#cbd5e1">Mira 10 s. ¿Parpadea la pantalla?</p>
  <p><a href="./index.html" style="color:#fb923c">← volver al índice</a></p>
</main>
<a class="float" href="#" onclick="return false">
  <span class="ping-wrap"><span class="ping"></span><span class="dot"></span></span>
  Cotizar por WhatsApp
</a>
</body>
</html>
