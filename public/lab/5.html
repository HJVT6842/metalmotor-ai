<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5 · Cabecera pegajosa + scroll</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; min-height:100%; background:#0f172a; color:#fff;
               font-family:-apple-system, system-ui, sans-serif; }
  header { position: sticky; top: 0; z-index: 40; height: 64px;
           display:flex; align-items:center; padding: 0 20px;
           border-bottom: 1px solid rgba(255,255,255,.1);
           background: rgba(15,23,42,.8); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
  main { padding: 28px 20px; }
  .row { padding: 16px 0; border-bottom: 1px solid rgba(255,255,255,.06); color:#cbd5e1; }
</style>
</head>
<body>
<header><strong>Cabecera pegajosa (con blur)</strong></header>
<main>
  <h1>Prueba 5 — Cabecera pegajosa + scroll</h1>
  <p style="color:#cbd5e1">Header <code>sticky</code> con fondo translúcido + blur, y contenido largo para hacer scroll por debajo.</p>
  <p style="color:#cbd5e1">Haz scroll arriba y abajo ~10 s. ¿Parpadea?</p>
  <p><a href="./index.html" style="color:#fb923c">← volver al índice</a></p>
  <div id="rows"></div>
</main>
<script>
  var r = document.getElementById('rows');
  for (var i=1;i<=60;i++){ var d=document.createElement('div'); d.className='row'; d.textContent='Fila de contenido '+i; r.appendChild(d); }
</script>
</body>
</html>
