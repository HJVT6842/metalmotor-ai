<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>4 · Rejilla + blobs difuminados</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin:0; min-height:100%; background:#0f172a; color:#fff;
               font-family:-apple-system, system-ui, sans-serif; }
  .hero { position: relative; overflow: hidden; min-height: 100vh; }
  /* bg-grid del sitio */
  .grid { position:absolute; inset:0;
          background-image:
            linear-gradient(to right, rgba(148,163,184,.07) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(148,163,184,.07) 1px, transparent 1px);
          background-size: 48px 48px; }
  /* blobs con blur grande, como el hero */
  .blob { position:absolute; border-radius:9999px; pointer-events:none; filter: blur(120px); }
  .b1 { right:-160px; top:-160px; width:34rem; height:34rem; background:rgba(234,88,12,.25); }
  .b2 { bottom:-160px; left:-160px; width:28rem; height:28rem; background:rgba(249,115,22,.15); }
  main { position:relative; padding: 28px 20px; }
  .tail { min-height: 120vh; padding: 28px 20px; }
</style>
</head>
<body>
<div class="hero">
  <div class="grid"></div>
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <main>
    <h1>Prueba 4 — Rejilla + blobs difuminados</h1>
    <p style="color:#cbd5e1">Fondo + rejilla de ingeniería + dos manchas con blur(120px) (sin animación).</p>
    <p style="color:#cbd5e1">Mira 10 s y haz scroll. ¿Parpadea?</p>
    <p><a href="./index.html" style="color:#fb923c">← volver al índice</a></p>
  </main>
</div>
<div class="tail">Zona de scroll para probar el repintado.</div>
</body>
</html>
